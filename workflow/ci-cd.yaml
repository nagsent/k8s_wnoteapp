name: CI-CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/notes-backend:latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/notes-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/db/db-configmap.yaml
          kubectl apply -f k8s/db/db-secret.yaml
          kubectl apply -f k8s/db/postgres-service.yaml
          kubectl apply -f k8s/db/postgres-statefulset.yaml
          kubectl apply -f k8s/backend/backend-configmap.yaml
          kubectl apply -f k8s/backend/backend-deployment.yaml
          kubectl apply -f k8s/backend/backend-service.yaml
          kubectl apply -f k8s/frontend/frontend-configmap.yaml
          kubectl apply -f k8s/frontend/frontend-deployment.yaml
          kubectl apply -f k8s/frontend/frontend-service.yaml
          kubectl apply -f k8s/ingress.yaml

