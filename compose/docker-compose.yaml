version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: notes-postgres
    environment:
      POSTGRES_DB: notesdb
      POSTGRES_USER: notesuser
      POSTGRES_PASSWORD: securepass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - notes-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: notes-backend
    environment:
      DB_HOST: postgres
      DB_NAME: notesdb
      DB_USER: notesuser
      DB_PASSWORD: securepass
    depends_on:
      - postgres
    ports:
      - "5000:5000"
    networks:
      - notes-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: notes-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - notes-net

networks:
  notes-net:

volumes:
  postgres_data:

