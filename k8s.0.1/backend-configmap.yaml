apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-code-cm
  namespace: web-app-ns
data:
  app.py: |
    from flask import Flask, request, jsonify
    import psycopg2
    import os

    app = Flask(__name__)

    DB_HOST = os.getenv("DB_HOST", "postgres-svc")
    DB_NAME = os.getenv("DB_NAME", "notesdb")
    DB_USER = os.getenv("DB_USER", "notesuser")
    DB_PASSWORD = os.getenv("DB_PASSWORD", "changeme")

    def get_conn():
      return psycopg2.connect(
        host=DB_HOST,
        dbname=DB_NAME,
        user=DB_USER,
        password=DB_PASSWORD
      )

    @app.route("/api/notes", methods=["GET"])
    def list_notes():
      conn = get_conn()
      cur = conn.cursor()
      cur.execute("CREATE TABLE IF NOT EXISTS notes (id SERIAL PRIMARY KEY, content TEXT);")
      cur.execute("SELECT id, content FROM notes ORDER BY id DESC;")
      rows = cur.fetchall()
      cur.close()
      conn.close()
      return jsonify([{"id": r[0], "content": r[1]} for r in rows])

    @app.route("/api/notes", methods=["POST"])
    def create_note():
      data = request.get_json()
      content = data.get("content", "")
      if not content:
        return jsonify({"error": "content required"}), 400
      conn = get_conn()
      cur = conn.cursor()
      cur.execute("CREATE TABLE IF NOT EXISTS notes (id SERIAL PRIMARY KEY, content TEXT);")
      cur.execute("INSERT INTO notes (content) VALUES (%s) RETURNING id;", (content,))
      note_id = cur.fetchone()[0]
      conn.commit()
      cur.close()
      conn.close()
      return jsonify({"id": note_id, "content": content}), 201

    if __name__ == "__main__":
      app.run(host="0.0.0.0", port=5000)
