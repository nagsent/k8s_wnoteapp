apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-api-sm
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: backend-api
  namespaceSelector:
    matchNames:
      - web_app_ns
  endpoints:
    - port: http
      path: /metrics
      interval: 15s

