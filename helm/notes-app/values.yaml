namespace: webappns

frontend:
  image: "yourdockerhub/notes-frontend:latest"
  replicas: 2
  servicePort: 80

backend:
  image: "yourdockerhub/notes-backend:latest"
  replicas: 2
  servicePort: 5000

database:
  name: notesdb
  user: notesuser
  password: securepass
  storage: 1Gi

#ingress:
#  host: notes.local
ingress:
  host: notes.local
  email: "your-email@example.com"
  tls: false

monitoring:
  enabled: false
