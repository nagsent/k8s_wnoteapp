apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-nginx-dep
  namespace: web-app-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-nginx
  template:
    metadata:
      labels:
        app: frontend-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: web-content
          configMap:
            name: frontend-web-cm
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-nginx-svc
  namespace: web-app-ns
spec:
  type: ClusterIP
  selector:
    app: frontend-nginx
  ports:
    - port: 80
      targetPort: 80
