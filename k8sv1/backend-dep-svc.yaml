apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api-dep
  namespace: web-app-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
        - name: backend-api
          image: python:3.11-slim
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: db-config-cm
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: db-config-cm
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: db-config-cm
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: backend-code
              mountPath: /app
          # This step-by-step manifest runs the stock Python image and mounts
          # app.py from a ConfigMap, so install the app's runtime dependencies
          # before starting it.
          command: ["sh", "-c"]
          args:
            - pip install --no-cache-dir flask psycopg2-binary && exec python /app/app.py
      volumes:
        - name: backend-code
          configMap:
            name: backend-code-cm
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api-svc
  namespace: web-app-ns
spec:
  type: ClusterIP
  selector:
    app: backend-api
  ports:
    - port: 5000
      targetPort: 5000
